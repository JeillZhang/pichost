name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pichost
          POSTGRES_PASSWORD: pichost
          POSTGRES_DB: pichost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pichost -d pichost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web-ui
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: cargo build -p pichost-api

      - name: Create local storage dir
        run: mkdir -p storage-local-test

      - name: Run E2E tests
        working-directory: web-ui
        run: npx playwright test
        env:
          PICHOST_AUTH__JWT_SECRET: e2e-ci-jwt-secret-at-least-32-bytes!!
          PICHOST_SERVER__PUBLIC_URL: http://localhost:3000
          PICHOST_DATABASE_URL: postgres://pichost:pichost@localhost:5432/pichost
          PICHOST_REDIS_URL: redis://localhost:6379
          PICHOST_STORAGE__LOCAL_BASE_PATH: ../storage-local-test
          PICHOST_RATE_LIMIT__AUTH_MAX: 1000
          PICHOST_RATE_LIMIT__UPLOAD_MAX: 1000
          PICHOST_RATE_LIMIT__GENERAL_MAX: 1000
          PICHOST_RATE_LIMIT__PUBLIC_MAX: 1000
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-ui/playwright-report/
            web-ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
