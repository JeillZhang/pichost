name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json
      - name: Build frontend
        run: cd web-ui && npm ci && npm run build
      - name: Build backend
        run: cargo build --release --target ${{ matrix.target }} -p pichost-api -p pichost-worker
      - name: Strip binaries
        run: strip target/${{ matrix.target }}/release/pichost-api target/${{ matrix.target }}/release/pichost-worker
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PKG_NAME="pichost-${VERSION}-${{ matrix.arch }}"
          mkdir -p dist/$PKG_NAME/web-ui dist/$PKG_NAME/scripts
          cp target/${{ matrix.target }}/release/pichost-api dist/$PKG_NAME/
          cp target/${{ matrix.target }}/release/pichost-worker dist/$PKG_NAME/
          cp -r web-ui/dist dist/$PKG_NAME/web-ui/
          cp -r migrations dist/$PKG_NAME/
          cp -r nginx dist/$PKG_NAME/
          cp .env.example dist/$PKG_NAME/
          cp scripts/install.sh scripts/uninstall.sh dist/$PKG_NAME/scripts/
          cp scripts/pichost-api.service scripts/pichost-worker.service dist/$PKG_NAME/scripts/
          cp README.md dist/$PKG_NAME/
          cd dist && tar czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pichost-${{ matrix.arch }}
          path: dist/*.tar.gz
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PicHost ${{ github.ref_name }}"
          body: |
            ## PicHost ${{ github.ref_name }}
            ### Install
            ```bash
            tar xzf pichost-${{ github.ref_name }}-amd64.tar.gz
            cd pichost-${{ github.ref_name }}-amd64
            sudo bash scripts/install.sh
            ```
            ### Architecture Support
            | Arch | Filename |
            |------|----------|
            | x86_64 (amd64) | `pichost-${{ github.ref_name }}-amd64.tar.gz` |
            ### Changes
            See [CHANGELOG](https://github.com/JeillZhang/pichost/blob/main/CHANGELOG.md)
          files: |
            pichost-amd64/dist/*.tar.gz
          draft: false
          prerelease: false
