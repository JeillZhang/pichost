name: Release
on:
  push:
    tags: ['v*']
  # Manual trigger for safe testing: Actions → Release → Run workflow → select a tag ref.
  #   draft=true      → creates a draft release (invisible until manually published)
  #   prerelease=true → marks the release as pre-release (does not become Latest)
  # Automatic behavior derives from the tag name (see the release job):
  #   v1.2.3-rc.1 / -beta / -alpha / -pre  → pre-release
  #   v1.2.3-draft                         → draft release
  #   v1.2.3                               → public final release
  workflow_dispatch:
    inputs:
      draft:
        type: boolean
        default: false
        description: Create the release as a draft (invisible until published)
      prerelease:
        type: boolean
        default: false
        description: Mark the release as a pre-release
jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json
      - name: Build frontend
        run: cd web-ui && npm ci && npm run build
      - name: Install Zig
        if: matrix.arch == 'arm64'
        uses: mlugg/setup-zig@v2
      - name: Build backend
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cargo install cargo-zigbuild
            cargo zigbuild --release --target ${{ matrix.target }} -p pichost-api -p pichost-worker
          else
            cargo build --release --target ${{ matrix.target }} -p pichost-api -p pichost-worker
          fi
      - name: Install cross strip tools
        if: matrix.arch == 'arm64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Strip binaries
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/pichost-api target/${{ matrix.target }}/release/pichost-worker
          else
            strip target/${{ matrix.target }}/release/pichost-api target/${{ matrix.target }}/release/pichost-worker
          fi
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Install packaging tools
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm
      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PKG_NAME="pichost-${VERSION}-${{ matrix.arch }}"
          mkdir -p dist/$PKG_NAME/web-ui dist/$PKG_NAME/scripts
          cp target/${{ matrix.target }}/release/pichost-api dist/$PKG_NAME/
          cp target/${{ matrix.target }}/release/pichost-worker dist/$PKG_NAME/
          cp -r web-ui/dist dist/$PKG_NAME/web-ui/
          cp -r migrations dist/$PKG_NAME/
          cp -r migrations-sqlite dist/$PKG_NAME/
          cp -r nginx dist/$PKG_NAME/
          cp .env.example dist/$PKG_NAME/
          cp scripts/install.sh scripts/uninstall.sh dist/$PKG_NAME/scripts/
          cp scripts/pichost-api.service scripts/pichost-worker.service dist/$PKG_NAME/scripts/
          cp README.md dist/$PKG_NAME/
          cd dist && tar czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
          # 原生包(已 build release 二进制;--no-build 复用,不重复编译)
          cd .. && (cd pichost-api && cargo deb --target ${{ matrix.target }} --no-build --output ../dist/pichost.deb)
          (cd pichost-api && cargo generate-rpm --target-dir ../target --target ${{ matrix.target }} -o ../dist/pichost.rpm)
          cd dist && mv pichost.deb "pichost-${VERSION}-${{ matrix.arch }}.deb"
          mv pichost.rpm "pichost-${VERSION}-${{ matrix.arch }}.rpm"
          test -f "pichost-${VERSION}-${{ matrix.arch }}.rpm"
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pichost-${{ matrix.arch }}
          path: dist/*
  macos:
    name: Build macOS universal2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json
      - run: cd web-ui && npm ci && npm run build
      - run: cargo build --release --target aarch64-apple-darwin -p pichost-api -p pichost-worker
      - run: cargo build --release --target x86_64-apple-darwin -p pichost-api -p pichost-worker
      - name: Create universal binaries
        run: |
          lipo -create -output pichost-api-universal \
            target/aarch64-apple-darwin/release/pichost-api \
            target/x86_64-apple-darwin/release/pichost-api
          lipo -create -output pichost-worker-universal \
            target/aarch64-apple-darwin/release/pichost-worker \
            target/x86_64-apple-darwin/release/pichost-worker
      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          PKG_NAME="pichost-${VERSION}-darwin-universal"
          mkdir -p dist/$PKG_NAME/web-ui
          cp pichost-api-universal pichost-worker-universal dist/$PKG_NAME/
          cp -r web-ui/dist/. dist/$PKG_NAME/web-ui/
          cp -r migrations dist/$PKG_NAME/
          cp -r migrations-sqlite dist/$PKG_NAME/
          cd dist && tar czf "${PKG_NAME}.tar.gz" "$PKG_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: pichost-darwin-universal
          path: dist/*.tar.gz
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-ui/package-lock.json
      - run: cd web-ui && npm ci && npm run build
      - run: cargo build --release --target x86_64-pc-windows-msvc -p pichost-api -p pichost-worker
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build installer
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          mkdir staging
          copy target\x86_64-pc-windows-msvc\release\pichost-api.exe staging\
          copy target\x86_64-pc-windows-msvc\release\pichost-worker.exe staging\
          xcopy web-ui\dist staging\dist\ /E /I /Y
          xcopy migrations staging\migrations\ /E /I /Y
          xcopy migrations-sqlite staging\migrations-sqlite\ /E /I /Y
          makensis -NOCD /DINSTALLER_VERSION=${{ github.ref_name }} /DstagingDir=staging packaging\windows\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: pichost-windows
          path: PicHost-setup-*.exe
  release:
    name: Create Release
    needs: [build, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PicHost ${{ github.ref_name }}"
          body: |
            ## PicHost ${{ github.ref_name }}
            ### Install
            ```bash
            tar xzf pichost-${{ github.ref_name }}-amd64.tar.gz
            cd pichost-${{ github.ref_name }}-amd64
            sudo bash scripts/install.sh
            ```
            ### Architecture Support
            | Arch | Filename |
            |------|----------|
            | x86_64 (amd64) | `pichost-${{ github.ref_name }}-amd64.tar.gz` / `.deb` / `.rpm` |
            | aarch64 (arm64) | `pichost-${{ github.ref_name }}-arm64.tar.gz` / `.deb` / `.rpm` |
            | macOS (universal2) | `pichost-${{ github.ref_name }}-darwin-universal.tar.gz` |
            | Windows (x86_64) | `PicHost-setup-${{ github.ref_name }}.exe` |
            ### Changes
            See [CHANGELOG](https://github.com/JeillZhang/pichost/blob/main/CHANGELOG.md)
          files: |
            pichost-amd64/*
            pichost-arm64/*
            pichost-darwin-universal/*.tar.gz
            pichost-windows/PicHost-setup-*.exe
          # Inputs win when manually dispatched; otherwise derive from the tag name
          draft: ${{ inputs.draft == 'true' || contains(github.ref_name, '-draft') }}
          prerelease: ${{ inputs.prerelease == 'true' || contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre') }}
