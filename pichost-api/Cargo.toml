[package]
name = "pichost-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pichost-core = { path = "../pichost-core" }
pichost-worker = { path = "../pichost-worker" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
dotenvy.workspace = true
deadpool-redis.workspace = true
redis.workspace = true
uuid.workspace = true
chrono.workspace = true
axum.workspace = true
jsonwebtoken.workspace = true
argon2.workspace = true
sha2.workspace = true
rand.workspace = true
tower.workspace = true
tower-http.workspace = true
infer.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
prometheus = "0.13"
lazy_static = "1.5"
oauth2 = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
toml_edit = "0.22"
regex = "1"
thiserror.workspace = true
async-trait.workspace = true
dialoguer = "0.12"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
serde_urlencoded = "0.7"
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
serial_test = "3"
argon2.workspace = true
rand.workspace = true

[[bin]]
name = "pichost-api"
path = "src/main.rs"

[package.metadata.deb]
name = "pichost"
section = "web"
priority = "optional"
maintainer = "Jeill Zhang <jeillzhang@users.noreply.github.com>"
depends = "$auto"
assets = [
    ["target/release/pichost-api", "usr/bin/", "755"],
    ["target/release/pichost-worker", "usr/bin/", "755"],
    ["../web-ui/dist/*", "usr/share/pichost/web-ui/", "644"],
    ["../web-ui/dist/assets/*", "usr/share/pichost/web-ui/assets/", "644"],
    ["../migrations/*", "usr/share/pichost/migrations/", "644"],
    ["../migrations-sqlite/*", "usr/share/pichost/migrations-sqlite/", "644"],
    ["../packaging/common/install-lib.sh", "usr/share/pichost/", "644"],
    ["../scripts/pichost-api.service", "lib/systemd/system/", "644"],
    ["../scripts/pichost-worker.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../packaging/deb"

[package.metadata.generate-rpm]
name = "pichost"
summary = "Self-hosted image hosting server (SQLite-first)"
license = "MIT"
url = "https://github.com/JeillZhang/pichost"
assets = [
    { source = "target/release/pichost-api", dest = "/usr/bin/", mode = "755" },
    { source = "target/release/pichost-worker", dest = "/usr/bin/", mode = "755" },
    { source = "../web-ui/dist/*", dest = "/usr/share/pichost/web-ui/", mode = "644" },
    { source = "../web-ui/dist/assets/*", dest = "/usr/share/pichost/web-ui/assets/", mode = "644" },
    { source = "../migrations/*", dest = "/usr/share/pichost/migrations/", mode = "644" },
    { source = "../migrations-sqlite/*", dest = "/usr/share/pichost/migrations-sqlite/", mode = "644" },
    { source = "../packaging/common/install-lib.sh", dest = "/usr/share/pichost/", mode = "644" },
    { source = "../scripts/pichost-api.service", dest = "/usr/lib/systemd/system/", mode = "644" },
    { source = "../scripts/pichost-worker.service", dest = "/usr/lib/systemd/system/", mode = "644" },
]
post_install_script = "../packaging/rpm/postinstall.sh"
pre_uninstall_script = "../packaging/rpm/preuninstall.sh"
post_uninstall_script = "../packaging/rpm/postuninstall.sh"
